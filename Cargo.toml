[package]
name = "erh_llm"
version = "0.4.0"
edition = "2024"

[dependencies]
#ollama-rs = { version = "0.3", features = ["macros", "tool-implementations"] }
#ollama-rs = { path = "../ollama-rs/ollama-rs", features = ["macros", "tool-implementations"] }
ollama-rs = { git = "http://github.com/digitizer0/ollama-rs.git",  tag = "0.3.52", features = ["macros", "tool-implementations"] }
mistralai-client = "0.14"
log = "0.4"
regex = "1.12.3"
futures = "0.3"
thiserror = "2.0"
async-trait = "0.1"

reqwest = { version = "0.12", features = ["json", "stream"], optional = true }

#SQLite
rusqlite = { version = "0.39", optional = true }
uuid = { version = "1.17", optional = true }
r2d2 = {version = "0.8", optional = true}
r2d2_sqlite = {version = "0.34", optional = true}

#MySQL
mysql = { version = "28.0", optional = true }

#MSSQL
tokio = { version = "1.0", features = ["rt", "net", "rt-multi-thread"] }
tiberius = { version = "0.12", optional = true }
tokio-util = { version = "0.7", features = ["compat", "io"] }

#Fjall (To be used instead of memory history???)
#fjall = { version = "3.0", optional = true }

#Tools
serde = { version = "1.0", features = ["derive"] , optional = true }
serde_json = { version = "1.0", optional = true }
schemars = { version = "1.2", optional = true }

[features]
default = ["tools"]
sqlite_hist = ["rusqlite", "uuid","r2d2", "r2d2_sqlite"]
mysql_hist = ["mysql"]
mssql_hist = ["tiberius"]
tools = ["serde", "serde_json", "schemars"]
anthropic = ["reqwest", "serde", "serde_json"]

#[lints.clippy]
# Deny dangerous patterns
#unwrap_used = "deny"
#expect_used = "deny"
#panic = "deny"
# Additional useful lints
#pedantic = "warn"
#nursery = "warn"
# Allow some pedantic lints that might be too noisy
#missing_errors_doc = "allow"
#missing_panics_doc = "allow"
#module_name_repetitions = "allow"
